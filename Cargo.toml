[workspace]
resolver = "3"
members = [
    "crates/rushai",
    "crates/rushai-config",
    "crates/rushai-core",
    "crates/rushai-protocol",
    "crates/rushai-provider",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arferreira/rushai"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
predicates = "3"
rand = "0.9"
dotenvy = "0.15"
eventsource-stream = "0.2"
futures = "0.3"
glob = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls", "rustls-native-certs", "http2", "charset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tempfile = "3"
tracing = "0.1"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v7"] }
