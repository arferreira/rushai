[package]
name = "rushai-core"
description = "Engine for rushai: sessions, storage, and the agent loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

keywords = ["ai", "agent", "llm"]
categories = ["development-tools"]

[dependencies]
async-trait = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
rushai-protocol = { path = "../rushai-protocol", version = "0.1.0" }
rushai-provider = { path = "../rushai-provider", version = "0.1.0" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }
tokio-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
