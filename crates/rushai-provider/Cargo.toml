[package]
name = "rushai-provider"
description = "LLM provider clients for rushai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["ai", "agent", "llm"]
categories = ["development-tools"]

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rushai-protocol = { path = "../rushai-protocol", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
wiremock = { workspace = true }
